name: Build Verified Orgs Master List

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours (staggered) — capture quickly, $0 cost
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-verified-orgs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Capture verified orgs (ProPublica / IRS filings, free)
        run: node scripts/build-verified-orgs.js
      - name: Commit registry
        run: |
          git config user.name "polytab-bot"
          git config user.email "polytab-bot@users.noreply.github.com"
          git add docs/data/verified-orgs.json
          if git diff --cached --quiet; then
            echo "No new verified orgs"
            exit 0
          fi
          git commit -m "Verified orgs: capture master list (IRS filings, honest)"
          git pull --rebase --autostash origin main
          git push
