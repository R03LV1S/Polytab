name: Event Radar Scan

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours — current events stay fresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: event-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Offline tests (read-only)
        run: |
          node tests/event-radar.test.js
          node tests/markets.test.js
      - name: Scan free public feeds for voting potentials
        run: node scripts/discover-events.js
      - name: Commit radar queue
        run: |
          git config user.name "polytab-bot"
          git config user.email "polytab-bot@users.noreply.github.com"
          git add docs/data/event-queue.json
          if git diff --cached --quiet; then
            echo "No new radar items"
            exit 0
          fi
          git commit -m "Event Radar: queue update"
          git pull --rebase --autostash origin main
          git push
