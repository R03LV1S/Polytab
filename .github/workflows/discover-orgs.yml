name: Discover Verified Organizations

on:
  schedule:
    - cron: "0 0 * * 0"  # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Discover and verify orgs
        env:
          CHARITY_NAV_API_KEY: ${{ secrets.CHARITY_NAV_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/discover-orgs.js
      - name: Commit new orgs
        run: |
          git config user.name "polytab-bot"
          git config user.email "polytab-bot@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then echo "No new orgs found"; else git commit -m "Auto-discover verified organizations"; git push; fi
