name: Ingest Global Verified Orgs (Multi-country)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-global-verified-orgs
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ingest from multiple public registries (free)
        run: node scripts/ingest-global-verified-orgs.js
      - name: Commit verified-orgs registry if changed
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/verified-orgs.json
          if git diff --cached --quiet; then
            echo "No verified-orgs changes to commit."
            exit 0
          fi
          git commit -m "Verified orgs: multi-country registry ingest (evidence-backed)"
          BRANCH="${GITHUB_REF_NAME:-main}"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ "$EVENT_NAME" = "schedule" ]; then git pull --rebase --autostash "$REMOTE" "$BRANCH" || true; fi
          git push "$REMOTE" "HEAD:$BRANCH"
 