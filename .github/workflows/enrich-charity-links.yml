name: Enrich Charity Links

# COST SAFETY: $0 only. Uses GitHub-hosted runners (free tier) and free/public sources (official websites, ProPublica pages).
# No paid APIs/services. Bounded fetches and polite delays to stay within free limits.

on:
  schedule:
    - cron: "23 3 * * *"  # daily, staggered
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enrich-charity-links
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enrich charity website/social links ($0, free sources)
        env:
          MAX_ENRICH_FETCHES: "120"
          ENRICH_DELAY_MS: "350"
        run: node scripts/enrich-charity-links.js
      - name: Generate feeds (if changed)
        run: node scripts/generate-feeds.js
      - name: Commit enriched data and feeds
        run: |
          git config user.name "polytab-bot"
          git config user.email "polytab-bot@users.noreply.github.com"
          git add docs/feed.json docs/data/global-charities.json docs/feed.xml docs/feeds
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Enrich charity website/social links (free sources, honest)"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
