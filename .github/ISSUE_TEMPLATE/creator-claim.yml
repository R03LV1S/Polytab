name: Creator Claim — Community & Creator Cause
description: Claim a locked Creator Cause by verifying TikTok account ownership and adding a verified Base payout wallet. Free, public, auditable ($0).
title: "[Creator Claim]: "
labels: ["creator-claim", "pending-verification"]
body:
  - type: markdown
    attributes:
      value: |
        Claim a Polytab Community & Creator Cause page. Creator causes are open-ended, direct support/tip (no A/B voting), and **not 501(c)(3) required**.
        Verification requires: (1) TikTok account ownership verification, (2) Base payout wallet control, and (3) public proof of work.
        Contributions remain locked until verification is complete. Polytab does not hold funds in normal direct-to-wallet flows (see Terms).
  - type: input
    id: project_id
    attributes:
      label: Project ID
      placeholder: "75001"
    validations:
      required: true
  - type: input
    id: tiktok_handle
    attributes:
      label: TikTok handle/profile URL
      placeholder: "@yourhandle or https://www.tiktok.com/@yourhandle"
    validations:
      required: true
  - type: input
    id: tiktok_verification
    attributes:
      label: TikTok verification evidence
      description: "Best: complete Polytab TikTok Login Kit verification and paste the verified label/profile returned. Alternative: public TikTok video/post containing the code `polytab-verify:<project id>`."
      placeholder: "Verified via Polytab TikTok Login Kit: @yourhandle (profile URL) OR https://www.tiktok.com/@yourhandle/video/..."
    validations:
      required: true
  - type: input
    id: payout_wallet
    attributes:
      label: Payout wallet — 0x address on Base (chain ID 8453)
      description: Contributions for this page settle directly into this wallet after verification. Ethereum-format 0x address, 42 characters.
      placeholder: "0x0000000000000000000000000000000000000000"
    validations:
      required: true
  - type: textarea
    id: wallet_proof
    attributes:
      label: Wallet ownership proof
      description: "Sign the message `polytab-creator-claim:<project_id>:<wallet_lowercase>:<unix_timestamp>` with the payout wallet and paste signature + timestamp. Or provide equivalent wallet-control proof."
      placeholder: "Message: polytab-creator-claim:75001:0xabc...:1732310400\nSignature: 0x...\nTimestamp: 1732310400"
    validations:
      required: true
  - type: textarea
    id: proof_links
    attributes:
      label: Proof of work / evidence links
      description: Public TikTok videos/posts, receipts, or updates showing the work/cause.
      placeholder: "https://www.tiktok.com/@yourhandle/video/..."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      placeholder: "Optional context"
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I control this TikTok account and the provided payout wallet, and I am authorized to claim this Creator Cause page.
          required: true
        - label: I understand this is an open-ended direct support/tip cause (no A/B voting), not tax-deductible unless a verified nonprofit/fiscal sponsor explicitly states so.
          required: true
        - label: I understand contributions/support are final and generally non-refundable; Polytab does not hold funds in normal direct-to-wallet flows (see Terms).
          required: true