name: Organization Claim — Polytab Bounty Page
description: Claim your organization's Polytab bounty page and unlock donations. Free, public, auditable ($0).
title: "[Org Claim]: "
labels: ["org-claim"]
body:
  - type: markdown
    attributes:
      value: |
        Claim a Polytab bounty page and unlock donations for it. Donations, when enabled, settle directly on-chain into the payout wallet you provide below — Polytab never holds funds.
        Before submitting, read the full policy at https://polytab.store/claim.html.
        Verification is NOT optional and never uses self-asserted contact info: we require BOTH a registry match and domain control (DNS TXT or an email from the org's official domain).
  - type: input
    id: org_name
    attributes:
      label: Organization legal name
      placeholder: "World Health Organization (WHO)"
    validations:
      required: true
  - type: textarea
    id: project_ids
    attributes:
      label: Project IDs this claim covers
      description: Comma-separated canonical project IDs (e.g. 10001, 20401) or "all" if you claim every page attributed to this organization.
      placeholder: "10001"
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Official organization website
      placeholder: "https://www.who.int"
    validations:
      required: true
  - type: input
    id: registry_name
    attributes:
      label: Registry name and ID
      description: e.g. IRS EIN, Canada Revenue Agency BN, UK Charity Commission number, or state nonprofit registry.
      placeholder: "IRS EIN 12-3456789"
    validations:
      required: true
  - type: input
    id: registry_url
    attributes:
      label: Registry lookup URL
      placeholder: "https://apps.irs.gov/app/eos/organizations/123456789/..."
    validations:
      required: true
  - type: input
    id: requester
    attributes:
      label: First and last name of requesting officer
      description: Must appear as an officer on the organization's public record.
    validations:
      required: true
  - type: input
    id: contact_email
    attributes:
      label: Official email (same domain as the org website)
      placeholder: "donations@who.int"
    validations:
      required: true
  - type: input
    id: payout_wallet
    attributes:
      label: Payout wallet — 0x address on Base (chain ID 8453)
      description: Donations for this page settle directly into this wallet. Ethereum-format 0x address, 42 characters.
      placeholder: "0x0000000000000000000000000000000000000000"
    validations:
      required: true
  - type: dropdown
    id: verification_mode
    attributes:
      label: Verification method (both are required)
      description: We require a registry match AND domain control. DNS TXT is the fastest self-serve proof; the fallback is an email from the org's official domain to the requester listed in the registry. Self-asserted contact info (DMs, phone calls, personal email, social posts) is never accepted.
      options:
        - DNS TXT (polytab-verify=<project id> TXT on the org domain)
        - Official email from the org's domain (to the registry-listed officer)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Anything else that helps verification
      description: Links to annual reports, official donation pages, press releases confirming the payout wallet, or screenshots of the registry entry.
      placeholder: "https://..."
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I am authorized to claim Polytab bounty pages on behalf of this organization, and this wallet belongs to the organization.
          required: true
        - label: I understand donations are final and non-refundable, and that the donation button for this page becomes usable from the moment verification completes.
          required: true
        - label: I understand sweeps/donations are public (transaction hashes and receipts are published in this repository and feeds).
          required: true
