name: Organization Claim — Polytab Bounty Page
description: Claim your organization's Polytab bounty page to receive the escrowed funds. Free, public, auditable ($0).
title: "[Org Claim]: "
labels: ["org-claim"]
body:
  - type: markdown
    attributes:
      value: |
        Claim a Polytab bounty page on behalf of an organization. Funds sit in the Polytab-managed escrow on Base (0x1e89ff2c2922528c8AcE8dB07F73ef979Ea76C08) until verification, then are swept on-chain to the payout wallet you provide below.
        Before submitting, read the full policy (verification, sweeps, unclaimed funds) at https://polytab.store/claim.html.
  - type: input
    id: org_name
    attributes:
      label: Organization legal name
      placeholder: "World Health Organization (WHO)"
    validations:
      required: true
  - type: textarea
    id: project_ids
    attributes:
      label: Project IDs this claim covers
      description: Comma-separated canonical project IDs (e.g. 10001, 20401) or "all" if you claim every page attributed to this organization.
      placeholder: "10001"
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Official organization website
      placeholder: "https://www.who.int"
    validations:
      required: true
  - type: input
    id: registry_name
    attributes:
      label: Registry name and ID
      description: e.g. IRS EIN, Canada Revenue Agency BN, UK Charity Commission number, or state nonprofit registry.
      placeholder: "IRS EIN 12-3456789"
    validations:
      required: true
  - type: input
    id: registry_url
    attributes:
      label: Registry lookup URL
      placeholder: "https://apps.irs.gov/app/eos/organizations/123456789/..."
    validations:
      required: true
  - type: input
    id: requester
    attributes:
      label: First and last name of requesting officer
      description: Must appear as an officer on the organization's public record.
    validations:
      required: true
  - type: input
    id: contact_email
    attributes:
      label: Official email (same domain as the org website)
      placeholder: "donations@who.int"
    validations:
      required: true
  - type: input
    id: payout_wallet
    attributes:
      label: Payout wallet — 0x address on Base (chain ID 8453)
      description: We sweep the escrow here. Ethereum-format 0x address, 42 characters.
      placeholder: "0x0000000000000000000000000000000000000000"
    validations:
      required: true
  - type: dropdown
    id: verification_mode
    attributes:
      label: Preferred verification method
      description: We will use both where possible. DNS TXT is the strongest self-serve proof; otherwise we match the registry listing.
      options:
        - DNS TXT (polytab-verify=<project id> TXT on the org domain)
        - Registry listing
        - Official email (same-domain email to the registry officer)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Anything else that helps verification
      description: Links to annual reports, official donation pages, press releases confirming the payout wallet, or screenshots of the registry entry.
      placeholder: "https://..."
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I am authorized to claim Polytab bounty pages on behalf of this organization, and this wallet belongs to the organization.
          required: true
        - label: I understand escrowed donations are final, non-refundable, and are swept to this wallet on verification, or handled per the unclaimed-bounty policy after the campaign's verification window closes.
          required: true
        - label: I understand sweeps are public (transaction hashes and receipts are published in this repository and feeds).
          required: true
